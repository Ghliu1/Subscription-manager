<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubTrack — Subscription Manager & Finance Analyzer</title>
  <meta name="description" content="Track subscriptions, renewal dates, payment methods and find what to cut down." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">💸</span>
        <span class="brand-name">SubTrack</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">📊</span> Dashboard</button>
        <button class="nav-item" data-view="subscriptions"><span class="nav-icon">📋</span> Subscriptions</button>
        <button class="nav-item" data-view="calendar"><span class="nav-icon">📅</span> Renewals</button>
        <button class="nav-item" data-view="analysis"><span class="nav-icon">🔎</span> Analysis</button>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-sm" id="exportBtn">⬇ Export</button>
        <button class="btn btn-ghost btn-sm" id="importBtn">⬆ Import</button>
        <input type="file" id="importFile" accept="application/json" hidden />
        <button class="btn btn-ghost btn-sm" id="seedBtn">✨ Demo data</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Dashboard</h1>
          <p class="muted" id="viewSubtitle">Your money at a glance</p>
        </div>
        <button class="btn btn-primary" id="addBtn">+ Add subscription</button>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">Add subscription</h2>
        <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
      </div>
      <form id="subForm" class="form">
        <input type="hidden" id="f-id" />
        <div class="form-grid">
          <label class="field span-2">
            <span>Name</span>
            <input type="text" id="f-name" required placeholder="Netflix" />
          </label>
          <label class="field">
            <span>Cost</span>
            <input type="number" id="f-cost" required min="0" step="0.01" placeholder="15.99" />
          </label>
          <label class="field">
            <span>Billing cycle</span>
            <select id="f-cycle">
              <option value="weekly">Weekly</option>
              <option value="monthly" selected>Monthly</option>
              <option value="quarterly">Quarterly</option>
              <option value="yearly">Yearly</option>
            </select>
          </label>
          <label class="field">
            <span>Next renewal</span>
            <input type="date" id="f-renewal" required />
          </label>
          <label class="field">
            <span>Category</span>
            <select id="f-category">
              <option>Streaming</option>
              <option>Music</option>
              <option>Software</option>
              <option>Cloud / Storage</option>
              <option>News</option>
              <option>Gaming</option>
              <option>Fitness</option>
              <option>Utilities</option>
              <option>Productivity</option>
              <option>Education</option>
              <option>Other</option>
            </select>
          </label>
          <label class="field">
            <span>Payment method</span>
            <input type="text" id="f-payment" list="paymentList" placeholder="Visa ••4242" />
            <datalist id="paymentList"></datalist>
          </label>
          <label class="field">
            <span>Status</span>
            <select id="f-status">
              <option value="active">Active</option>
              <option value="paused">Paused</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
          <label class="field span-2">
            <span>Usage (how often do you use it?)</span>
            <select id="f-usage">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="rarely">Rarely</option>
              <option value="never">Never</option>
            </select>
          </label>
          <label class="field span-2">
            <span>Notes</span>
            <textarea id="f-notes" rows="2" placeholder="Shared with family, free trial ends..."></textarea>
          </label>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" id="deleteBtn" hidden>Delete</button>
          <div class="spacer"></div>
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
